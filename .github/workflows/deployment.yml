name: Deploy to GitHub Pages

# Temporary pipeline for the current GitHub Pages host. Retired at
# docs/aws-migration-plan.md Phase 2, once DNS and hosting cut over to
# CloudFront (see .github/workflows/deploy-frontend.yml, added then).

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm install

    - name: Build the static export
      working-directory: frontend
      run: npm run build

    - name: Ensure CNAME file is included
      run: echo "built-illinois.org" > frontend/out/CNAME

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/out
